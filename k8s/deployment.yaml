apiVersion: apps/v1
kind: Deployment
metadata:
  name: football-app
  namespace: football-app
  labels:
    app: football-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: football-app
  template:
    metadata:
      labels:
        app: football-app
    spec:
      containers:
      - name: football-app
        image: ghcr.io/yourusername/footballwebapp:latest
        ports:
        - containerPort: 5000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: football-app-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: football-app-secrets
              key: redis-url
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: football-app-secrets
              key: api-key
        - name: FLASK_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
      imagePullSecrets:
      - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: football-app-service
  namespace: football-app
spec:
  selector:
    app: football-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: football-app-ingress
  namespace: football-app
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - your-domain.com
    secretName: football-app-tls
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: football-app-service
            port:
              number: 80