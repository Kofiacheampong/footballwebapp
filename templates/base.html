<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}European Leagues{% endblock %}</title>
    <!-- Bootstrap CSS (Bootstrap 5.3) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('index') }}">European Leagues</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#navbarOffcanvas" aria-controls="navbarOffcanvas" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas-end bg-dark text-white" tabindex="-1" id="navbarOffcanvas" aria-labelledby="offcanvasLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasLabel">Menu</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        {% for league_name, logo_url in league_logos.items() %}
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == url_for('league', league_name=league_name) %}active{% endif %}" 
                               href="{{ url_for('league', league_name=league_name) }}">
                                <img src="{{ logo_url }}" alt="{{ league_name }}" width="30" class="me-2">
                                {{ league_name.replace('-', ' ').title() }}
                            </a>
                        </li>
                        {% endfor %}
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == url_for('top_scorer') %}active{% endif %}" 
                               href="{{ url_for('top_scorer') }}">Top Scorers</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == url_for('top_assists') %}active{% endif %}" 
                               href="{{ url_for('top_assists') }}">Top Assists</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == url_for('compare_players') %}active{% endif %}" 
                               href="{{ url_for('compare_players') }}">Player Comparison</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS (Bootstrap 5 bundle, no jQuery) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous" defer></script>
</body>
</html>
