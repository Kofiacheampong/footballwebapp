{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="mb-4">
        <i class="fas fa-exclamation-triangle text-warning" style="font-size: 5rem;"></i>
    </div>
    <h1 class="display-1 fw-bold text-muted">500</h1>
    <p class="h4 mb-2">Internal Server Error</p>
    <p class="text-muted mb-4">Something went wrong on our end. We're working to fix it!</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
        <i class="fas fa-home me-2"></i>Go Home
    </a>
</div>
{% endblock %}
